<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Расписание 3 курс (ОФО) — Числитель / Знаменатель</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
    }
    /* Стили для Числителя (Белый) */
    .card-numerator {
      background-color: #ffffff;
      color: #0f172a;
      border-left: 6px solid #cbd5e1;
      box-shadow: 0 4px 15px rgba(255, 255, 255, 0.08);
    }
    /* Стили для Знаменателя (Синий) */
    .card-denominator {
      background: linear-gradient(135deg, #1e40af 0%, #1d4ed8 100%);
      color: #ffffff;
      border-left: 6px solid #60a5fa;
      box-shadow: 0 4px 15px rgba(29, 78, 216, 0.35);
    }
    .active-week-ring {
      outline: 2px solid #38bdf8;
      outline-offset: 2px;
    }
  </style>
</head>
<body class="min-h-screen pb-16">

  <!-- Шапка -->
  <header class="sticky top-0 z-30 bg-slate-900/90 backdrop-blur-md border-b border-slate-800">
    <div class="max-w-6xl mx-auto px-4 py-4 flex flex-col md:flex-row md:items-center md:justify-between gap-4">
      <div>
        <div class="flex items-center gap-2">
          <span class="px-2.5 py-0.5 text-xs font-semibold rounded-full bg-indigo-500/20 text-indigo-300 border border-indigo-500/30">
            3 КУРС • ОФО • 5 СЕМЕСТР
          </span>
          <span id="current-date-badge" class="text-xs text-slate-400"></span>
        </div>
        <h1 class="text-2xl font-bold tracking-tight text-white mt-1">Расписание учебных занятий</h1>
      </div>

      <!-- Индикатор текущей и следующей недели -->
      <div class="flex flex-wrap items-center gap-3">
        <div id="this-week-banner" class="px-3.5 py-2 rounded-xl text-xs font-medium flex items-center gap-2 border">
          <span>Эта неделя:</span>
          <strong id="this-week-label" class="text-sm">...</strong>
        </div>
        <div id="next-week-banner" class="px-3.5 py-2 rounded-xl text-xs font-medium flex items-center gap-2 border bg-slate-800/70 border-slate-700 text-slate-300">
          <span>Следующая:</span>
          <strong id="next-week-label" class="text-sm">...</strong>
        </div>
      </div>
    </div>
  </header>

  <!-- Панель управления -->
  <section class="max-w-6xl mx-auto px-4 mt-6">
    <div class="bg-slate-800/60 border border-slate-700/70 rounded-2xl p-4 md:p-5 flex flex-col lg:flex-row gap-4 items-stretch lg:items-center justify-between">
      
      <!-- Выбор группы -->
      <div class="flex flex-col sm:flex-row sm:items-center gap-3 flex-1">
        <label for="group-select" class="text-sm font-medium text-slate-300 whitespace-nowrap">
          Выберите группу:
        </label>
        <select id="group-select" class="w-full sm:max-w-xs bg-slate-900 border border-slate-700 text-white text-sm rounded-xl px-4 py-2.5 focus:outline-none focus:border-blue-500 transition">
          <option value="241Р01 ИНФ">241Р01 ИНФ</option>
          <option value="241Р71 Эконом">241Р71 Эконом</option>
          <option value="241Р91 Архитектура">241Р91 Архитектура</option>
          <option value="241Р111 Дизайн">241Р111 Дизайн</option>
          <option value="241Р11 ПГС">241Р11 ПГС</option>
          <option value="241Р31 ЭН">241Р31 ЭН</option>
          <option value="241Р21 УЗС">241Р21 УЗС</option>
          <option value="241Р41 ТМС">241Р41 ТМС</option>
          <option value="241Р61 НТТС">241Р61 НТТС</option>
        </select>
      </div>

      <!-- Фильтр Числитель / Знаменатель -->
      <div class="flex flex-wrap items-center gap-2">
        <button data-filter="all" class="filter-btn px-3.5 py-2 rounded-xl text-xs font-semibold bg-slate-700 text-white transition">
          Обе недели
        </button>
        <button data-filter="numerator" class="filter-btn px-3.5 py-2 rounded-xl text-xs font-semibold bg-white text-slate-900 hover:bg-slate-100 transition flex items-center gap-1.5">
          <span class="w-2.5 h-2.5 rounded-full bg-slate-900 inline-block"></span>
          Числитель (Белый)
        </button>
        <button data-filter="denominator" class="filter-btn px-3.5 py-2 rounded-xl text-xs font-semibold bg-blue-600 text-white hover:bg-blue-500 transition flex items-center gap-1.5">
          <span class="w-2.5 h-2.5 rounded-full bg-blue-200 inline-block"></span>
          Знаменатель (Синий)
        </button>
      </div>
    </div>

    <!-- Легенда -->
    <div class="flex flex-wrap items-center justify-between gap-4 mt-4 px-1 text-xs text-slate-400">
      <div class="flex items-center gap-4">
        <span class="flex items-center gap-1.5">
          <span class="w-3.5 h-3.5 rounded bg-white border border-slate-300 inline-block"></span>
          Числитель — белый цвет
        </span>
        <span class="flex items-center gap-1.5">
          <span class="w-3.5 h-3.5 rounded bg-blue-600 inline-block"></span>
          Знаменатель — синий цвет
        </span>
      </div>
      <div id="status-message" class="text-slate-400">Загрузка данных из таблицы...</div>
    </div>
  </section>

  <!-- Контейнер расписания -->
  <main id="schedule-container" class="max-w-6xl mx-auto px-4 mt-6 grid grid-cols-1 gap-6">
    <!-- Сюда рендерятся дни недели -->
  </main>

  <script>
    // Конфигурация Google Таблицы
    const SPREADSHEET_URI = 'https://docs.google.com/spreadsheets/d/' + '1AkCRgvmlPlkq6XYNdNSkPzhcZm3eI-Xu2c2kabK0Avg';
    let currentFilter = 'all';
    let cachedScheduleData = [];

    // 1. Логика расчёта недели (Опорная дата: Пятница, 30 октября 2026 = Числитель)
    function getWeekParity(date = new Date()) {
      // Понедельник опорной недели (26 октября 2026, 00:00:00)
      const anchorMonday = new Date(2026, 9, 26, 0, 0, 0);
      const current = new Date(date.getFullYear(), date.getMonth(), date.getDate());
      const dayOfWeek = (current.getDay() + 6) % 7; // 0 = Понедельник ... 6 = Воскресенье
      const currentMonday = new Date(current);
      currentMonday.setDate(current.getDate() - dayOfWeek);

      const diffWeeks = Math.round((currentMonday - anchorMonday) / (7 * 24 * 60 * 60 * 1000));
      const isNumerator = Math.abs(diffWeeks % 2) === 0;
      return {
        thisWeek: isNumerator ? 'numerator' : 'denominator',
        nextWeek: isNumerator ? 'denominator' : 'numerator',
        dayIndex: dayOfWeek
      };
    }

    function renderWeekBanners() {
      const now = new Date();
      const parity = getWeekParity(now);
      const daysRu = ['Воскресенье', 'Понедельник', 'Вторник', 'Среда', 'Четверг', 'Пятница', 'Суббота'];
      const dateStr = now.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' });
      document.getElementById('current-date-badge').textContent = `${daysRu[now.getDay()]}, ${dateStr}`;

      const thisBanner = document.getElementById('this-week-banner');
      const thisLabel = document.getElementById('this-week-label');
      const nextBanner = document.getElementById('next-week-banner');
      const nextLabel = document.getElementById('next-week-label');

      if (parity.thisWeek === 'numerator') {
        thisBanner.className = 'px-3.5 py-2 rounded-xl text-xs font-medium flex items-center gap-2 bg-white text-slate-900 border border-slate-200 shadow-sm';
        thisLabel.textContent = 'ЧИСЛИТЕЛЬ (Белая)';
        nextBanner.className = 'px-3.5 py-2 rounded-xl text-xs font-medium flex items-center gap-2 bg-blue-600 text-white border border-blue-400 shadow-sm';
        nextLabel.textContent = 'ЗНАМЕНАТЕЛЬ (Синяя)';
      } else {
        thisBanner.className = 'px-3.5 py-2 rounded-xl text-xs font-medium flex items-center gap-2 bg-blue-600 text-white border border-blue-400 shadow-sm';
        thisLabel.textContent = 'ЗНАМЕНАТЕЛЬ (Синяя)';
        nextBanner.className = 'px-3.5 py-2 rounded-xl text-xs font-medium flex items-center gap-2 bg-white text-slate-900 border border-slate-200 shadow-sm';
        nextLabel.textContent = 'ЧИСЛИТЕЛЬ (Белая)';
      }
    }

    // 2. Загрузка листа из Google Sheets через JSONP (без проблем с CORS)
    function fetchSheetData(sheetName) {
      return new Promise((resolve, reject) => {
        const callbackName = 'gvizCallback_' + Math.random().toString(36).substring(2, 9);
        const script = document.createElement('script');
        const url = `${SPREADSHEET_URI}/gviz/tq?tqx=out:json;responseHandler:${callbackName}&sheet=${encodeURIComponent(sheetName)}`;

        window[callbackName] = function(response) {
          delete window[callbackName];
          document.body.removeChild(script);
          if (response && response.table) {
            resolve(response.table);
          } else {
            reject(new Error('Не удалось получить таблицу'));
          }
        };

        script.onerror = () => {
          delete window[callbackName];
          document.body.removeChild(script);
          reject(new Error('Ошибка сети при загрузке Google Таблицы'));
        };

        script.src = url;
        document.body.appendChild(script);
      });
    }

    // 3. Парсинг строк таблицы с учётом объединённых ячеек (Числитель = 1-я строка слота, Знаменатель = 2-я строка слота)
    function parseScheduleTable(table) {
      const rawRows = table.rows.map(r => (r.c || []).map(cell => (cell && cell.v !== null && cell.v !== undefined) ? String(cell.v).trim() : ''));
      
      const validDays = ['понедельник', 'вторник', 'среда', 'четверг', 'пятница', 'суббота'];
      const daysMap = new Map();

      let currentDay = '';
      let lastTime = '';
      let slotCounter = 0; // 0 = числитель, 1 = знаменатель

      for (let i = 0; i < rawRows.length; i++) {
        const row = rawRows[i];
        const colDay = (row[0] || '').trim();
        const colTime = (row[1] || '').trim();
        const colChange = (row[2] || '').trim();
        const colSubject = (row[3] || '').trim();
        const colTeacher = (row[4] || '').trim();
        const colRoom = (row[5] || '').trim();
        const colType = (row[6] || '').trim();

        // Определяем день недели
        if (colDay && validDays.includes(colDay.toLowerCase())) {
          currentDay = colDay.charAt(0).toUpperCase() + colDay.slice(1).toLowerCase();
          if (!daysMap.has(currentDay)) {
            daysMap.set(currentDay, []);
          }
        }

        if (!currentDay) continue;

        // Определяем временной интервал (например, 08:30-10:05)
        const timeRegex = /\d{1,2}[:.]\d{2}\s*-\s*\d{1,2}[:.]\d{2}/;
        if (colTime && timeRegex.test(colTime)) {
          if (colTime !== lastTime) {
            lastTime = colTime;
            slotCounter = 0;
          } else {
            slotCounter = 1;
          }
        } else if (lastTime) {
          // Если ячейка времени пустая из-за объединения вертикально — это вторая строка (знаменатель)
          slotCounter = 1;
        } else {
          continue;
        }

        const daySlots = daysMap.get(currentDay);
        let timeEntry = daySlots.find(item => item.time === lastTime);
        if (!timeEntry) {
          timeEntry = {
            time: lastTime,
            numerator: null,
            denominator: null
          };
          daySlots.push(timeEntry);
        }

        const lessonData = {
          changes: colChange,
          subject: colSubject,
          teacher: colTeacher,
          room: colRoom,
          type: colType
        };

        if (slotCounter === 0 && !timeEntry.numerator) {
          timeEntry.numerator = lessonData;
        } else {
          timeEntry.denominator = lessonData;
        }
      }

      return Array.from(daysMap.entries()).map(([day, slots]) => ({ day, slots }));
    }

    // 4. Отрисовка карточки конкретной недели (Числитель — белый, Знаменатель — синий)
    function renderHalfCard(lesson, parityType) {
      const isNumerator = parityType === 'numerator';
      const badgeLabel = isNumerator ? 'Числитель' : 'Знаменатель';
      const cardClass = isNumerator ? 'card-numerator' : 'card-denominator';
      const subTextClass = isNumerator ? 'text-slate-600' : 'text-blue-100';
      const mutedBadgeClass = isNumerator
        ? 'bg-slate-100 text-slate-800 border border-slate-300'
        : 'bg-blue-800/80 text-blue-100 border border-blue-400/40';

      const hasContent = lesson && (lesson.subject || lesson.changes);

      return `
        <div class="${cardClass} rounded-xl p-3.5 transition flex flex-col justify-between min-h-[92px]">
          <div class="flex items-center justify-between gap-2 mb-1.5">
            <span class="text-[11px] font-bold uppercase tracking-wider px-2 py-0.5 rounded-md ${mutedBadgeClass}">
              ${badgeLabel}
            </span>
            ${lesson && lesson.type ? `
              <span class="text-xs font-bold px-2 py-0.5 rounded ${isNumerator ? 'bg-slate-900 text-white' : 'bg-white text-blue-900'}">
                ${lesson.type}
              </span>
            ` : ''}
          </div>

          ${hasContent ? `
            <div class="space-y-1">
              ${lesson.subject ? `<div class="font-semibold text-sm leading-snug">${lesson.subject}</div>` : ''}
              ${lesson.changes ? `
                <div class="text-xs font-medium px-2 py-1 rounded ${isNumerator ? 'bg-amber-100 text-amber-900 border border-amber-300' : 'bg-amber-400/20 text-amber-200 border border-amber-300/40'}">
                  ⚡ Изменение: ${lesson.changes}
                </div>
              ` : ''}
            </div>
            <div class="flex flex-wrap items-center justify-between gap-2 mt-2 pt-2 border-t ${isNumerator ? 'border-slate-200' : 'border-blue-400/30'} text-xs ${subTextClass}">
              <span>${lesson.teacher ? `👤 ${lesson.teacher}` : ''}</span>
              <span>${lesson.room ? `🚪 Каб. ${lesson.room}` : ''}</span>
            </div>
          ` : `
            <div class="text-xs italic opacity-60 my-auto">Нет занятий (окно)</div>
          `}
        </div>
      `;
    }

    // 5. Полный рендер расписания
    function renderSchedule() {
      const container = document.getElementById('schedule-container');
      if (!cachedScheduleData.length) {
        container.innerHTML = `
          <div class="bg-slate-800/50 border border-slate-700 rounded-2xl p-8 text-center text-slate-400">
            Для выбранной группы расписание пока не заполнено или не найдено.
          </div>
        `;
        return;
      }

      container.innerHTML = cachedScheduleData.map(dayBlock => {
        const slotsHtml = dayBlock.slots.map(slot => {
          const numCard = (currentFilter === 'all' || currentFilter === 'numerator')
            ? renderHalfCard(slot.numerator, 'numerator')
            : '';
          const denCard = (currentFilter === 'all' || currentFilter === 'denominator')
            ? renderHalfCard(slot.denominator, 'denominator')
            : '';

          const gridCols = currentFilter === 'all' ? 'grid-cols-1 md:grid-cols-2' : 'grid-cols-1';

          return `
            <div class="p-3 sm:p-4 bg-slate-900/60 rounded-2xl border border-slate-800 flex flex-col lg:flex-row gap-4 items-stretch lg:items-center">
              <!-- Время -->
              <div class="lg:w-36 shrink-0 flex lg:flex-col justify-between lg:justify-center items-center lg:items-start px-2">
                <span class="text-xs uppercase tracking-wider text-slate-400 font-medium">Время пары</span>
                <span class="text-base font-bold text-white mt-0.5">${slot.time}</span>
              </div>

              <!-- Слоты Числителя и Знаменателя -->
              <div class="flex-1 grid ${gridCols} gap-3">
                ${numCard}
                ${denCard}
              </div>
            </div>
          `;
        }).join('');

        return `
          <div class="bg-slate-800/40 border border-slate-700/80 rounded-3xl p-4 sm:p-6 shadow-xl">
            <div class="flex items-center justify-between mb-4 pb-3 border-b border-slate-700/70">
              <h2 class="text-lg sm:text-xl font-bold text-white flex items-center gap-2.5">
                <span class="w-2.5 h-6 rounded-full bg-indigo-500 inline-block"></span>
                ${dayBlock.day}
              </h2>
              <span class="text-xs text-slate-400">${dayBlock.slots.length} пар(ы)</span>
            </div>
            <div class="space-y-3">
              ${slotsHtml}
            </div>
          </div>
        `;
      }).join('');
    }

    // 6. Инициализация и обработчики событий
    async function loadGroupSchedule(groupName) {
      const statusEl = document.getElementById('status-message');
      statusEl.textContent = `Загрузка расписания группы «${groupName}»...`;
      try {
        const table = await fetchSheetData(groupName);
        cachedScheduleData = parseScheduleTable(table);
        statusEl.textContent = `Актуальные данные из таблицы загружены (${groupName})`;
        renderSchedule();
      } catch (err) {
        console.error(err);
        statusEl.textContent = 'Не удалось загрузить данные напрямую. Проверьте доступ к таблице.';
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderWeekBanners();

      const selectEl = document.getElementById('group-select');
      const savedGroup = localStorage.getItem('selectedGroup_3course');
      if (savedGroup && Array.from(selectEl.options).some(o => o.value === savedGroup)) {
        selectEl.value = savedGroup;
      }

      selectEl.addEventListener('change', (e) => {
        const group = e.target.value;
        localStorage.setItem('selectedGroup_3course', group);
        loadGroupSchedule(group);
      });

      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          currentFilter = btn.dataset.filter;
          document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('ring-2', 'ring-sky-400'));
          btn.classList.add('ring-2', 'ring-sky-400');
          renderSchedule();
        });
      });

      loadGroupSchedule(selectEl.value);
    });
  </script>
</body>
</html>
